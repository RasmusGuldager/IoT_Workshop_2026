<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoT Workshop – Server</title>
<style>
  :root {
    --bg: #0f1420; --panel: #182033; --line: #2a3550; --text: #e8ecf5;
    --muted: #8d98b3; --accent: #4fd1a5; --server: #f6c85f; --system: #7aa2ff; --privat: #e58fd8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; height: 100vh;
         display: grid; grid-template-rows: auto 1fr; }
  header { display: flex; align-items: baseline; gap: 24px; padding: 16px 24px;
           border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 28px; }
  .addr { font-size: 22px; color: var(--muted); }
  .addr b { color: var(--accent); font-family: ui-monospace, monospace; font-size: 26px; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #wall { overflow-y: auto; padding: 16px 24px; }
  .msg { padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 24px; line-height: 1.35; }
  .msg .t { color: var(--muted); font-size: 15px; margin-right: 10px; font-family: ui-monospace, monospace; }
  .msg .fra { font-weight: 700; color: var(--accent); margin-right: 8px; }
  .msg.server .fra { color: var(--server); }
  .msg.privat .fra { color: var(--privat); }
  .msg.system { font-size: 17px; color: var(--system); }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 16px;
          display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  aside h2 { margin: 0 0 8px; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
  li span:last-child { color: var(--muted); font-family: ui-monospace, monospace; font-size: 13px; }
  select, input, button { font: inherit; font-size: 15px; border-radius: 6px; border: 1px solid var(--line);
                          background: var(--bg); color: var(--text); padding: 8px; width: 100%; }
  button { background: var(--accent); color: #08261b; font-weight: 700; border: 0; cursor: pointer; }
  button.alt { background: var(--line); color: var(--text); }
  .row { display: flex; gap: 8px; }
  form { display: flex; flex-direction: column; gap: 8px; }
  #status { color: var(--muted); font-size: 13px; min-height: 1em; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>IoT Workshop</h1>
  <div class="addr">WiFi: <b id="wifi">…</b> &nbsp; Kode: <b id="kode">…</b></div>
  <div class="addr">Server-IP: <b id="ip">…</b> &nbsp; Port: <b id="port">…</b></div>
  <div class="addr">Forbundne ESP'er: <b id="count">0</b></div>
</header>
<main>
  <section id="wall"></section>
  <aside>
    <div>
      <h2>Send besked</h2>
      <form id="send">
        <select id="til"><option value="alle">Alle</option></select>
        <input id="tekst" placeholder="Skriv en besked…" autocomplete="off">
        <button type="submit">Send</button>
      </form>
    </div>
    <div>
      <h2>Kommandoer</h2>
      <div class="row">
        <button class="alt" data-cmd="BLINK">BLINK</button>
        <button class="alt" data-cmd="ON">ON</button>
        <button class="alt" data-cmd="OFF">OFF</button>
      </div>
      <p id="status"></p>
    </div>
    <div>
      <h2>Forbundet</h2>
      <ul id="clients"></ul>
    </div>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let lastN = -1;

  async function refresh() {
    try {
      const s = await (await fetch("/api/state")).json();
      $("ip").textContent = s.server.ip;
      $("port").textContent = s.server.port;
      $("wifi").textContent = s.server.wifi_navn;
      $("kode").textContent = s.server.wifi_kode;
      $("count").textContent = s.clients.length;

      $("clients").innerHTML = s.clients.map((c) => `<li><span>${esc(c.navn)}</span><span>${esc(c.ip)}</span></li>`).join("");

      const sel = $("til"), cur = sel.value;
      sel.innerHTML = `<option value="alle">Alle</option>` +
        s.clients.map((c) => `<option value="${c.id}">${esc(c.navn)}</option>`).join("");
      sel.value = [...sel.options].some((o) => o.value === cur) ? cur : "alle";

      const newestN = s.messages.length ? s.messages[s.messages.length - 1].n : 0;
      if (newestN !== lastN) {
        const wall = $("wall");
        const atBottom = wall.scrollHeight - wall.scrollTop - wall.clientHeight < 60;
        wall.innerHTML = s.messages.map((m) =>
          `<div class="msg ${m.type}"><span class="t">${esc(m.t)}</span>` +
          (m.type === "system" ? esc(m.tekst) : `<span class="fra">${esc(m.fra)}</span>${esc(m.tekst)}`) +
          `</div>`).join("");
        if (atBottom) wall.scrollTop = wall.scrollHeight;
        lastN = newestN;
      }
    } catch (e) {
      $("status").textContent = "Mistet forbindelse til serveren…";
    }
  }

  async function send(tekst, til) {
    const r = await fetch("/api/send", { method: "POST", headers: { "Content-Type": "application/json" },
                                         body: JSON.stringify({ tekst, til }) });
    const j = await r.json().catch(() => ({}));
    $("status").textContent = r.ok ? `"${tekst}" sendt til ${j.sendt_til} ESP'er` : "Kunne ikke sende";
    refresh();
  }

  $("send").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("tekst").value.trim();
    if (t) { send(t, $("til").value); $("tekst").value = ""; }
  });
  document.querySelectorAll("[data-cmd]").forEach((b) =>
    b.addEventListener("click", () => send(b.dataset.cmd, $("til").value)));

  refresh();
  setInterval(refresh, 1000);
</script>
</body>
</html>
